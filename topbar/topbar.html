<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Bar</title>
  <link rel="stylesheet" href="topbar.css">
</head>

<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="app-brand">
        <svg class="app-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="11" fill="#e30b5c" />
          <circle cx="12" cy="12" r="6.5" fill="none" stroke="#ffffff" stroke-width="1.8" />
          <polygon points="10.2,9.2 15.2,12 10.2,14.8" fill="#ffffff" />
        </svg>
        <span class="app-title">YouTube Music</span>
      </div>

      <div class="divider"></div>

      <nav class="action-buttons">
        <button id="btn-options" class="topbar-btn" title="Options (Ctrl+,)">
          <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13">
            <path
              d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
          </svg>
          <span>Options</span>
        </button>

        <button id="btn-refresh" class="topbar-btn" title="Refresh (F5)">
          <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12">
            <path
              d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
          </svg>
          <span>Refresh</span>
        </button>
      </nav>
    </div>

    <!-- Draggable space -->
    <div class="topbar-drag-region"></div>
  </header>
  <script src="topbar.js"></script>
</body>

</html>
