<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
  <title>Mini Player Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="settings.css" />
</head>

<body>
  <div class="titlebar">
    <span class="titlebar-icon">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" />
      </svg>
    </span>
    <span class="titlebar-text" id="title-text">Mini Player Settings</span>
    <button class="close-btn" id="close-btn" title="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="content">
    <div>
      <div class="section-label" id="theme-label" data-i18n="theme">Theme</div>
      <div class="theme-grid" id="theme-options">
        <button type="button" class="theme-btn" data-theme="midnight">
          <span class="swatch midnight"></span>
          <span data-i18n="theme_midnight">Midnight</span>
        </button>
        <button type="button" class="theme-btn" data-theme="blur">
          <span class="swatch blur"></span>
          <span data-i18n="theme_blur">Blur</span>
        </button>
      </div>
    </div>

    <div class="toggle-row">
      <span class="toggle-label" data-i18n="always_on_top">Always on top</span>
      <label class="switch">
        <input id="always-on-top" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <script src="settings.js"></script>
</body>

</html>
