<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'">
    <title id="config-title">Filter Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./settings-filters.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="titlebar">
        <span class="titlebar-icon">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" />
            </svg>
        </span>
        <span class="titlebar-text">Filter Settings</span>
        <button class="close-btn" id="close-btn" title="Close">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <main class="content">
        <form id="filter-form">
            <!-- Adblock Status Section -->
            <section class="card status-card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="bi bi-shield-check" style="color: var(--accent)"></i>
                        <span>Adblock Status</span>
                    </div>
                    <button id="reset-adblock-stats" type="button" class="btn btn-secondary btn-sm">Reset counters</button>
                </div>
                
                <div class="status-grid">
                    <div class="status-item">
                        <span class="status-label">State</span>
                        <span id="adblock-state" class="status-value highlight">...</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Enabled</span>
                        <span id="adblock-enabled-lists" class="status-value">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Checked</span>
                        <span id="adblock-checked" class="status-value">0</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">Blocked</span>
                        <span id="adblock-blocked" class="status-value">0</span>
                    </div>
                </div>
                <div id="adblock-hint" class="status-hint">Loading status...</div>
            </section>

            <!-- Video Ad Skipper Settings -->
            <section class="card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="bi bi-fast-forward-btn" style="color: var(--accent2)"></i>
                        <span>Video Ad Skipper</span>
                    </div>
                </div>
                <div class="toggle-row">
                    <div class="toggle-info">
                        <span class="toggle-label">Simple Skipper</span>
                        <span class="toggle-desc">Automatically skips video ads at the selected speed.</span>
                    </div>
                    <div class="toggle-controls">
                        <select id="ad-skip-speed" class="select-box">
                            <option value="2">2x Speed</option>
                            <option value="4">4x Speed</option>
                            <option value="6">6x Speed</option>
                            <option value="8">8x Speed</option>
                        </select>
                        <label class="switch">
                            <input id="ad-skipper-enabled" type="checkbox" />
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Filter List Section -->
            <section class="card list-card">
                <div class="card-header">
                    <div class="card-title">
                        <i class="bi bi-funnel"></i>
                        <span>Filter Lists</span>
                    </div>
                    <div class="header-actions">
                        <button id="reset-button" type="button" class="btn btn-danger-outline expandable-btn" title="Reset">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            <span id="reset-button-text">Reset</span>
                        </button>
                        <button id="cancel-button" type="button" class="btn btn-secondary expandable-btn" title="Cancel">
                            <i class="bi bi-x-lg"></i>
                            <span id="cancel-button-text">Cancel</span>
                        </button>
                        <button id="save-button" type="button" class="btn btn-primary expandable-btn" title="Save">
                            <i class="bi bi-save"></i>
                            <span id="save-button-text">Save Changes</span>
                        </button>
                        <div class="divider"></div>
                        <a href="#" id="more-filters" class="btn btn-secondary expandable-btn" title="Get more filters">
                            <i class="bi bi-github"></i> 
                            <span id="more-filters-text">More Filters</span>
                        </a>
                        <a href="#" id="add-filter" class="btn btn-primary expandable-btn" title="Add new filter">
                            <i class="bi bi-plus-lg"></i>
                            <span id="add-filter-text">Add</span>
                        </a>
                    </div>
                </div>
                <div id="filter-list" class="filter-list-container">
                    <!-- Filters injected here -->
                </div>
            </section>



            <!-- Modal for Adding Filters -->
            <div id="add-filter-modal" class="modal-overlay" hidden>
                <div class="modal-card">
                    <h3 id="add-filter-modal-title" class="modal-title">Add Filter</h3>
                    
                    <div class="modal-body">
                        <div class="input-group">
                            <label id="add-filter-name-label" class="input-label">Name</label>
                            <input id="add-filter-name" class="input-field" type="text" autocomplete="off" placeholder="e.g. My Custom Filter" />
                        </div>
                        
                        <div class="input-group">
                            <label id="add-filter-url-label" class="input-label">URL</label>
                            <input id="add-filter-url" class="input-field" type="text" autocomplete="off" placeholder="https://..." />
                        </div>
                        
                        <div id="add-filter-error" class="error-message" hidden></div>
                    </div>
                    
                    <div class="modal-footer">
                        <button id="add-filter-cancel" type="button" class="btn btn-secondary">
                            <span id="add-filter-cancel-text">Cancel</span>
                        </button>
                        <button id="add-filter-confirm" type="button" class="btn btn-primary">
                            <span id="add-filter-confirm-text">Add</span>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script src="./sf-renderer.js"></script>
</body>
</html>
